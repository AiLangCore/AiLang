name: Main Release Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-matrix:
    name: build-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            platform: linux
            arch: x64
            airun: ailang
            artifact_dir: .artifacts/ailang-linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            platform: linux
            arch: arm64
            airun: ailang
            artifact_dir: .artifacts/ailang-linux-arm64
          - os: macos-14
            rid: osx-x64
            platform: osx
            arch: x64
            airun: ailang
            artifact_dir: .artifacts/ailang-osx-x64
          - os: macos-14
            rid: osx-arm64
            platform: osx
            arch: arm64
            airun: ailang
            artifact_dir: .artifacts/ailang-osx-arm64
          - os: windows-latest
            rid: windows-x64
            platform: windows
            arch: x64
            airun: ailang.exe
            artifact_dir: .artifacts/ailang-windows-x64
            msvc_arch: amd64
          - os: windows-latest
            rid: windows-arm64
            platform: windows
            arch: arm64
            airun: ailang.exe
            artifact_dir: .artifacts/ailang-windows-arm64
            msvc_arch: amd64_arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout AiVM native source
        uses: actions/checkout@v6
        with:
          repository: AiLangCore/AiVM
          ref: develop
          path: AiVM

      - name: Setup MSVC tools
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Setup Linux ARM64 cross toolchain
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          {
            echo 'Types: deb'
            echo 'URIs: http://ports.ubuntu.com/ubuntu-ports'
            echo 'Suites: noble noble-updates noble-backports noble-security'
            echo 'Components: main universe restricted multiverse'
            echo 'Architectures: arm64'
            echo 'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg'
          } | sudo tee /etc/apt/sources.list.d/ubuntu-arm64.sources >/dev/null
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross libssl-dev:arm64

      - name: Stage AiLang tools (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          AIVM_C_SOURCE_DIR: ${{ github.workspace }}/AiVM/src
        run: |
          set -euo pipefail
          mkdir -p ./dist
          AILANG_NATIVE_PLATFORM="${{ matrix.platform }}" \
          AILANG_NATIVE_ARCH="${{ matrix.arch }}" \
          AILANG_IGNORE_PROJECT_TOOLCHAIN=1 ./scripts/build-ailang-native.sh
          cp "./.artifacts/ailang-${{ matrix.platform }}-${{ matrix.arch }}/ailang" "./dist/${{ matrix.airun }}"
          chmod +x "./dist/${{ matrix.airun }}"

      - name: Stage AiLang tools (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          AIVM_C_SOURCE_DIR: ${{ github.workspace }}\AiVM\src
        run: |
          New-Item -ItemType Directory -Force .\dist | Out-Null
          $env:AILANG_NATIVE_ARCH = '${{ matrix.arch }}'
          $env:AILANG_NATIVE_PLATFORM = '${{ matrix.platform }}'
          $env:AILANG_IGNORE_PROJECT_TOOLCHAIN = '1'
          ./scripts/build-ailang-native.ps1
          Copy-Item ".\.artifacts\ailang-${{ matrix.platform }}-${{ matrix.arch }}\ailang.exe" ".\dist\${{ matrix.airun }}"

      - name: Stage compiler assets (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./dist/compiler
          cp ./src/compiler/*.aos ./dist/compiler/

      - name: Stage compiler assets (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\dist\compiler | Out-Null
          Copy-Item .\src\compiler\*.aos .\dist\compiler\

      - name: Verify toolkit files (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          test -x "./dist/${{ matrix.airun }}"
          test -f ./dist/compiler/format.aos
          test -f ./dist/compiler/validate.aos
          test -f ./dist/compiler/route.aos
          test -f ./dist/compiler/json.aos
          test -f ./dist/compiler/http.aos
          test -f ./dist/compiler/runtime.aos

      - name: Verify toolkit files (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path ".\\dist\\${{ matrix.airun }}")) { throw 'missing airun' }
          if (-not (Test-Path .\dist\compiler\format.aos)) { throw 'missing compiler assets' }
          if (-not (Test-Path .\dist\compiler\runtime.aos)) { throw 'missing compiler assets' }

      - name: Runtime smoke (Unix)
        if: matrix.platform != 'windows' && !((matrix.platform == 'linux' && matrix.arch == 'arm64') || (matrix.platform == 'osx' && matrix.arch == 'x64'))
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ matrix.airun }}" --version >/dev/null

      - name: Memory leak gate (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/leak-reports
          echo "memory leak gate moved to AiVM"

      - name: Upload leak report (failed Unix run)
        if: failure() && matrix.platform != 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: main-release-leak-report-${{ matrix.rid }}
          path: .tmp/leak-reports/main-release-gate-${{ matrix.rid }}.txt
          if-no-files-found: ignore

      - name: Runtime smoke (Windows)
        if: matrix.platform == 'windows' && matrix.arch != 'arm64'
        shell: pwsh
        run: |
          & ".\\dist\\${{ matrix.airun }}" --version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'native runtime smoke failed' }

  wasm-runtime-artifact:
    name: wasm-runtime-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout AiVM native source
        uses: actions/checkout@v6
        with:
          repository: AiLangCore/AiVM
          ref: develop
          path: AiVM

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: latest

      - name: Build wasm runtime artifact
        shell: bash
        env:
          AIVM_C_SOURCE_DIR: ${{ github.workspace }}/AiVM/src
        run: |
          set -euo pipefail
          ./build.sh wasm
          test -f ./.artifacts/aivm-wasm32/aivm-runtime-wasm32.wasm

      - name: Stage host tools for wasm golden tests
        shell: bash
        env:
          AIVM_C_SOURCE_DIR: ${{ github.workspace }}/AiVM/src
        run: |
          set -euo pipefail
          AILANG_NATIVE_PLATFORM=linux \
          AILANG_NATIVE_ARCH=x64 \
          AILANG_IGNORE_PROJECT_TOOLCHAIN=1 ./build.sh legacy

      - name: Setup wasmtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://wasmtime.dev/install.sh | bash
          echo "${HOME}/.wasmtime/bin" >> "${GITHUB_PATH}"

      - name: Wasm golden smoke
        shell: bash
        env:
          AIVM_C_SOURCE_DIR: ${{ github.workspace }}/AiVM/src
        run: |
          set -euo pipefail
          chmod +x ./scripts/test-wasm-golden.sh
          mkdir -p .tmp
          ./scripts/test-wasm-golden.sh | tee .tmp/test-wasm-golden.log
          source_cases="$(sed -n 's/.*wasm golden corpus: PASS (\([0-9][0-9]*\) cases).*/\1/p' .tmp/test-wasm-golden.log | tail -n1)"
          bytecode_cases="$(sed -n 's/.*wasm bytecode-only corpus: PASS (\([0-9][0-9]*\) cases).*/\1/p' .tmp/test-wasm-golden.log | tail -n1)"
          malformed_cases="$(sed -n 's/.*wasm malformed corpus: PASS (\([0-9][0-9]*\) cases).*/\1/p' .tmp/test-wasm-golden.log | tail -n1)"
          profiles_status="fail"
          if grep -Fq 'wasm golden profiles: PASS (cli/spa/fullstack)' .tmp/test-wasm-golden.log; then
            profiles_status="pass"
          fi
          echo "### WASM Golden Coverage" >> "${GITHUB_STEP_SUMMARY}"
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Metric | Value |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|" >> "${GITHUB_STEP_SUMMARY}"
          echo "| source corpus | ${source_cases:-0} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| bytecode-only corpus | ${bytecode_cases:-0} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| malformed corpus | ${malformed_cases:-0} |" >> "${GITHUB_STEP_SUMMARY}"
          echo "| profiles (cli/spa/fullstack) | ${profiles_status} |" >> "${GITHUB_STEP_SUMMARY}"
